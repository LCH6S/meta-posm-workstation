<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>门店独立开票 · Demo</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#F7F8FA;color:#333;font:14px/1.5 'PingFang SC',-apple-system,sans-serif}header{padding:24px 24px 16px;max-width:1000px;margin:auto}h1{font-size:22px;font-weight:500;margin:0 0 8px}p{margin:0;color:#666}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}.tools button,.tools a{font:inherit;color:#333;padding:8px 12px;border:1px solid #DCDEE0;border-radius:4px;background:white;text-decoration:none;cursor:pointer}.tools .primary{background:#1C1D24;border-color:#1C1D24;color:white}.tools .small{font-size:12px;color:#666}.stage{max-width:440px;margin:auto;padding:0 16px 24px}.pane-head{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;font-weight:500;font-size:16px}.pane-head a{font-size:12px;color:#365DB0;font-weight:400}iframe{width:100%;height:860px;border:1px solid #DCDEE0;background:#fff;border-radius:8px;display:block}.note{max-width:1000px;padding:0 24px 32px;margin:auto;font-size:12px;color:#666}.case-tools{margin-top:12px}.case-tools button{font-size:12px;padding:6px 10px}#feedback{min-height:20px;margin-top:12px;font-size:12px;color:#666}@media(max-width:600px){header{padding:20px 16px}.tools button,.tools a{font-size:12px}iframe{height:800px}.note{padding:0 16px 24px}}
</style></head><body><header><h1>门店独立开票</h1><p>Meta POS → 电子发票 → 手动开票 / 开票记录 / 开票查询。C 端使用现有页面，本次不调整。</p><div class="tools"><a href="index.html" target="_blank" rel="noopener">单独打开门店端</a><label><input id="demo-entry-visible" type="checkbox">显示电子发票入口</label><label><input id="demo-manual-enabled" type="checkbox">门店已开通</label><button id="reset">重置样例</button><button id="scan-sample">模拟扫码：未申请样例</button></div><div class="tools case-tools"><span class="small">当前订单状态模拟：</span><button id="apply">提交开票申请</button><button id="issue">推进出票</button><button id="red">推进红冲</button></div><div class="tools case-tools"><span class="small">状态样例：</span><button data-case="unapplied">未申请</button><button data-case="processing">开票中</button><button data-case="issued">已开票</button><button data-case="refunding">红冲中</button><button data-case="failed">红冲失败</button></div><div id="feedback" role="status">评审控件不属于门店产品界面。</div></header>
<main class="stage"><div class="pane-head"><span>门店端</span><a href="index.html" target="_blank" rel="noopener">独立窗口</a></div><iframe id="clerk" src="index.html" title="门店端 Meta POS"></iframe></main>
<div class="note">订单、申请及发票状态保存在当前浏览器，不调用真实业务服务。二维码暂只承载订单标识，正式环境由既有 C 端申请入口承接；本 Demo 不设计或替换消费者页面。打印调用浏览器，不代表已接入 POS 打印机；模拟扫码验证设备结果回填。开票主体、税率及发票均为演示数据。</div>
<script src="core.js?v=20261116-record-query"></script><script>
const C=DemoCore,clerk=document.getElementById('clerk');let activeId=C.read().lastCreated;
for(const [id,key,read] of [['demo-entry-visible','invoiceEntryVisible',C.entryVisible],['demo-manual-enabled','manualInvoiceEnabled',C.manualAvailable]]){const control=document.getElementById(id);control.checked=read();control.onchange=()=>C.setDemoSettings({[key]:control.checked});}
const feedback=text=>document.getElementById('feedback').textContent=text;
const current=()=>C.order(activeId)||C.order(C.read().lastCreated)||C.listOrders('device')[0]||C.listOrders('brand')[0];
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==clerk.contentWindow||event.data?.type!=='invoice-active-order')return;activeId=event.data.id;feedback('当前订单：'+activeId);});
document.getElementById('scan-sample').onclick=()=>{const o=C.listOrders('brand').find(x=>!x.cancelled&&!x.application);if(o)clerk.contentWindow.postMessage({type:'invoice-scan-result',code:o.number||o.id},location.origin);};
document.getElementById('reset').onclick=()=>{if(!confirm('清除本 Demo 的订单并恢复初始样例？'))return;C.write(C.seed());activeId=C.read().lastCreated;clerk.src='index.html';feedback('已恢复初始样例');};
document.getElementById('apply').onclick=()=>{try{const o=current();C.apply(o.id,o.rev,{type:'company',title:'上海悦行科技有限公司',taxId:'91310000MA1DEMO001',email:'finance@example.com'});feedback('已模拟消费者提交申请：'+o.id);}catch(e){feedback(e.message);}};
document.getElementById('issue').onclick=()=>{const o=current();if(!o?.application||o.invoice){feedback('请先为当前订单提交申请');return;}if(!Number.isFinite(o.application.dueAt)){const db=C.read();db.orders.find(x=>x.id===o.id).application.dueAt=Date.now();C.write(db);}C.tick((o.application.dueAt||Date.now())+1);feedback('已推进出票，取消中的订单自动衔接红冲');};
document.getElementById('red').onclick=()=>{const o=current();if(o?.refund?.status!=='processing'){feedback('当前没有待处理的红冲');return;}C.tick(o.refund.dueAt+1);feedback('关联发票已全额红冲');};
document.querySelectorAll('[data-case]').forEach(button=>button.onclick=()=>{const db=C.read(),now=Date.now(),kind=button.dataset.case;db.sequence++;const id='KP'+C.date().replaceAll('-','')+String(db.sequence).padStart(4,'0');const o={id,number:'SCENE'+String(db.sequence).padStart(4,'0'),date:C.date(),note:'',brandId:C.CURRENT_BRAND_ID,store:'sqb002',device:'POS-002-01',rev:1,createdAt:now,updatedAt:now,cancelled:false,items:[{product:'clothes',cents:68000,quantity:2}],application:null,invoice:null,refund:null,log:[{text:'订单已创建',at:now}]};if(kind!=='unapplied')o.application={type:'company',title:'上海悦行科技有限公司',taxId:'91310000MA1DEMO001',email:'finance@example.com',submittedAt:now,dueAt:now+20000};if(['issued','refunding','failed'].includes(kind))o.invoice={number:'26'+String(now).padStart(18,'0'),issuedAt:now};if(['refunding','failed'].includes(kind)){o.cancelled=true;o.cancelledAt=now;o.refund={status:kind==='failed'?'failed':'processing',dueAt:now+20000};}db.orders.unshift(o);db.lastCreated=id;C.write(db);activeId=id;clerk.src='index.html#/order/'+id;feedback('当前订单：'+id);});
</script></body></html>
